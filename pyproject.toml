[project]
name = "battery-bench"
version = "0.1.0"
description = "Stand-alone benchmarking app for battery control algorithms against a building energy environment"
authors = [ { name = "Battery Bench" } ]
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["battery", "benchmark", "RL", "MPC", "energy", "grid", "gymnasium"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

dependencies = [
  "numpy>=1.24",
  "matplotlib>=3.7",
  "pyyaml>=6.0",
  "pandas>=2.0",
  "gymnasium>=0.29",
  "tabulate>=0.9",
  "linopy==0.5.5",
  "xarray>=2024.6.0,<2025.0.0",
  "scipy>=1.10",
  "jinja2>=3.1",
]

[project.scripts]
battery-bench = "rellflow_battery_bench.runner:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "."}
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["rellflow_battery_bench*"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-q"
testpaths = ["tests"]
